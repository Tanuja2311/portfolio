<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#666666"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FFBE5E"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1D9E75"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#378ADD"/>
    </marker>
    <marker id="arrow-coral" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D85A30"/>
    </marker>
  </defs>

  <!-- Row 1: Corporate Client (centered) -->
  <rect x="240" y="20" width="200" height="64" rx="8" fill="rgba(255,190,94,0.15)" stroke="#FFBE5E" stroke-width="0.5"/>
  <text x="340" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#E5E5E5">Corporate Client</text>
  <text x="340" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#999999">Creates requisitions, hires</text>

  <!-- Arrow: Client → Operations (labeled 'Add requisitions') -->
  <line x1="340" y1="84" x2="340" y2="122" stroke="#666666" stroke-width="0.5" marker-end="url(#arrow)"/>
  <text x="350" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999999">Add requisitions</text>

  <!-- Row 2: MyRCloud operations dashed container -->
  <rect x="100" y="126" width="480" height="88" rx="8" fill="none" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="6,4"/>
  <text x="340" y="119" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#1D9E75">MyRCloud operations</text>

  <!-- CSM node -->
  <rect x="130" y="146" width="180" height="54" rx="8" fill="rgba(29,158,117,0.15)" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="220" y="169" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#E5E5E5">CSM</text>
  <text x="220" y="187" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#999999">Manages clients</text>

  <!-- QC Team node -->
  <rect x="370" y="146" width="180" height="54" rx="8" fill="rgba(29,158,117,0.15)" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="460" y="169" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#E5E5E5">QC Team</text>
  <text x="460" y="187" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#999999">Screens candidates</text>

  <!-- Arrow: Operations → PSM (left) -->
  <line x1="220" y1="214" x2="220" y2="278" stroke="#666666" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Arrow: Operations → Recruiting Partner (right) -->
  <line x1="460" y1="214" x2="460" y2="278" stroke="#666666" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Row 3: PSM (left) and Recruiting Partner (right) -->
  <!-- PSM node -->
  <rect x="110" y="282" width="200" height="64" rx="8" fill="rgba(127,119,221,0.15)" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="210" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#E5E5E5">PSM</text>
  <text x="210" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#999999">Verifies and manages partners</text>

  <!-- Recruiting Partner node -->
  <rect x="370" y="282" width="200" height="64" rx="8" fill="rgba(216,90,48,0.15)" stroke="#D85A30" stroke-width="0.5"/>
  <text x="470" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#E5E5E5">Recruiting Partner</text>
  <text x="470" y="326" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#999999">Agency or independent recruiter</text>

  <!-- Horizontal arrow: PSM → Recruiting Partner -->
  <line x1="310" y1="314" x2="368" y2="314" stroke="#666666" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Arrow: Recruiting Partner → Candidate (labeled 'Source and submit CVs') -->
  <line x1="470" y1="346" x2="470" y2="408" stroke="#666666" stroke-width="0.5" marker-end="url(#arrow)"/>
  <text x="476" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999999">Source and submit CVs</text>

  <!-- Row 4: Candidate (centered) -->
  <rect x="340" y="412" width="200" height="64" rx="8" fill="rgba(55,138,221,0.15)" stroke="#378ADD" stroke-width="0.5"/>
  <text x="440" y="438" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#E5E5E5">Candidate</text>
  <text x="440" y="456" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#999999">Job seeker, tracked through pipeline</text>

  <!-- Right return arrow: Candidate → QC Team (CVs for review) -->
  <path d="M 590 444 C 640 444, 640 173, 560 173" stroke="#378ADD" stroke-width="0.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="615" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#378ADD" transform="rotate(90, 615, 316)">CVs for review</text>

  <!-- Left return arrow: Client → Candidate (Interview, assess, offer or reject) -->
  <path d="M 190 84 C 40 84, 40 444, 338 444" stroke="#FFBE5E" stroke-width="0.5" fill="none" marker-end="url(#arrow-amber)"/>
  <text x="30" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FFBE5E" transform="rotate(-90, 30, 280)">Interview, assess, offer or reject</text>

  <!-- QC back up to Client (short arrow) -->
  <path d="M 460 146 C 460 100, 420 84, 342 84" stroke="#1D9E75" stroke-width="0.5" fill="none" marker-end="url(#arrow-teal)" stroke-dasharray="4,3"/>

  <!-- Bottom caption -->
  <text x="340" y="504" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#999999">The complete recruitment loop: from requisition to hire</text>
</svg>
